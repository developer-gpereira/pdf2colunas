<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerador de Letras de Hinos em PDF. Crie e formate letras de músicas em duas colunas rapidamente.">
    <meta name="author" content="Guilherme">
    
    <title>Gerador de Letras - Hinos em PDF</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2pdf.js (via CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .a4-paper {
            width: 100%;
            background-color: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 10mm; 
            margin: 0 auto;
            color: #000;
            box-sizing: border-box;
        }

        /* Classes ajustadas matematicamente para evitar transbordo e página em branco (A4 útil = A4 total - margens) */
        .retrato {
            max-width: 200mm; /* A4(210mm) - 10mm (margens JS) */
            min-height: 286mm; /* A4(297mm) - 10mm (margens JS) - 1mm (buffer de segurança) */
            display: block; 
        }

        .paisagem {
            max-width: 287mm; /* A4(297mm) - 10mm (margens JS) */
            min-height: 199mm; /* A4(210mm) - 10mm (margens JS) - 1mm (buffer de segurança) */
            display: flex;
            flex-direction: column;
            justify-content: center; 
        }

        .letras-colunas {
            column-count: 2;
            column-gap: 30px; 
            text-align: left;
            line-height: 1.5;
        }

        .estrofe {
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen lg:h-screen flex flex-col lg:overflow-hidden">

    <header class="bg-white border-b border-slate-200 px-4 lg:px-6 py-4 shadow-sm z-20 shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🎵</span>
            <h1 class="text-xl font-bold text-slate-800">Gerador de Hinos PDF</h1>
        </div>
    </header>

    <div class="flex flex-col lg:flex-row flex-grow lg:overflow-hidden">
        
        <aside class="w-full lg:w-1/3 bg-white border-r border-slate-200 flex flex-col z-10 lg:overflow-y-auto shadow-sm">
            <div class="p-4 lg:p-6 flex flex-col flex-grow">
                
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">Conteúdo</h2>
                
                <div class="space-y-4 flex-grow flex flex-col">
                    <div>
                        <label for="titulo" class="block text-sm font-medium text-slate-700 mb-1">Título</label>
                        <input type="text" id="titulo" placeholder="Ex: Grandioso És Tu" 
                            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
                    </div>

                    <div>
                        <label for="autor" class="block text-sm font-medium text-slate-700 mb-1">Autor / Cantor</label>
                        <input type="text" id="autor" placeholder="Ex: Cantor Cristão" 
                            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
                    </div>

                    <div class="flex flex-col flex-grow">
                        <label for="letra" class="block text-sm font-medium text-slate-700 mb-1">Letra do Hino</label>
                        <span class="text-xs text-slate-500 mb-2 block">Dica: Separe as estrofes com uma linha em branco.</span>
                        <textarea id="letra" placeholder="Cole a letra do hino aqui..." 
                            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors resize-none flex-grow min-h-[150px] lg:min-h-[200px]"></textarea>
                    </div>
                </div>

                <hr class="my-6 border-slate-200">

                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">Estilos e Formatação</h2>
                
                <div class="space-y-4 mb-6">
                    <div>
                        <label for="estilo-fonte" class="block text-sm font-medium text-slate-700 mb-1">Família da Fonte Geral</label>
                        <select id="estilo-fonte" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="ui-sans-serif, system-ui, sans-serif">Sans-Serif (Moderna)</option>
                            <option value="ui-serif, Georgia, 'Times New Roman', serif">Serif (Clássica)</option>
                            <option value="ui-monospace, 'Courier New', monospace">Monospace (Máquina)</option>
                        </select>
                    </div>

                    <div>
                        <label for="orientacao" class="block text-sm font-medium text-slate-700 mb-1">Orientação da Página</label>
                        <select id="orientacao" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="portrait">Retrato (Vertical - Padrão)</option>
                            <option value="landscape">Paisagem (Horizontal - Centralizado)</option>
                        </select>
                    </div>

                    <!-- Configurações: Título -->
                    <div class="bg-slate-50 p-3 rounded-md border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-600 mb-2">TÍTULO</h3>
                        <div class="flex flex-wrap gap-3 items-center">
                            <div class="flex-1 min-w-[90px]">
                                <select id="tamanho-titulo" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500"></select>
                            </div>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="checkbox" id="negrito-titulo" class="mr-1.5 rounded text-indigo-600 focus:ring-indigo-500" checked> Negrito
                            </label>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="checkbox" id="italico-titulo" class="mr-1.5 rounded text-indigo-600 focus:ring-indigo-500"> Itálico
                            </label>
                        </div>
                    </div>

                    <!-- Configurações: Autor -->
                    <div class="bg-slate-50 p-3 rounded-md border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-600 mb-2">AUTOR / CANTOR</h3>
                        <div class="flex flex-wrap gap-3 items-center">
                            <div class="flex-1 min-w-[90px]">
                                <select id="tamanho-autor" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500"></select>
                            </div>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="checkbox" id="negrito-autor" class="mr-1.5 rounded text-indigo-600 focus:ring-indigo-500"> Negrito
                            </label>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="checkbox" id="italico-autor" class="mr-1.5 rounded text-indigo-600 focus:ring-indigo-500" checked> Itálico
                            </label>
                        </div>
                    </div>

                    <!-- Configurações: Letra -->
                    <div class="bg-slate-50 p-3 rounded-md border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-600 mb-2">LETRA (CONTEÚDO)</h3>
                        <div class="flex flex-wrap gap-3 items-center">
                            <div class="flex-1 min-w-[90px]">
                                <select id="tamanho-letra" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500"></select>
                            </div>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="checkbox" id="negrito-letra" class="mr-1.5 rounded text-indigo-600 focus:ring-indigo-500"> Negrito
                            </label>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="checkbox" id="italico-letra" class="mr-1.5 rounded text-indigo-600 focus:ring-indigo-500"> Itálico
                            </label>
                        </div>
                    </div>
                </div>

                <button id="btn-baixar" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3 px-4 rounded-md shadow-sm flex justify-center items-center gap-2 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Gerar PDF
                </button>
            </div>
        </aside>

        <main class="w-full lg:w-2/3 bg-slate-100 p-4 lg:p-10 lg:overflow-y-auto flex justify-center">
            <div id="documento-pdf" class="a4-paper retrato transition-all duration-300">
                <div class="text-center mb-6 pb-4 border-b-2 border-slate-200 w-full">
                    <h1 id="preview-titulo" class="uppercase tracking-wide text-slate-900 mb-2">TÍTULO DO HINO</h1>
                    <h3 id="preview-autor" class="text-slate-600">Nome do Cantor / Autor</h3>
                </div>

                <div id="preview-letra" class="letras-colunas">
                    <div class="text-slate-400 italic text-center h-full flex flex-col justify-center items-center opacity-70" style="column-span: all; margin-top: 50px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mb-4"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                        <p>A letra formatada em duas colunas aparecerá aqui.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const configuracoesTamanho = [
                { id: 'tamanho-titulo', padrao: 28 },
                { id: 'tamanho-autor', padrao: 16 },
                { id: 'tamanho-letra', padrao: 14 }
            ];

            configuracoesTamanho.forEach(config => {
                const selectElement = document.getElementById(config.id);
                for (let i = 8; i <= 48; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `${i}px`;
                    if (i === config.padrao) option.selected = true; 
                    selectElement.appendChild(option);
                }
            });

            const formInputs = {
                titulo: document.getElementById('titulo'),
                autor: document.getElementById('autor'),
                letra: document.getElementById('letra')
            };

            const styleInputs = {
                fonteGlobal: document.getElementById('estilo-fonte'),
                orientacao: document.getElementById('orientacao'),
                
                tituloTamanho: document.getElementById('tamanho-titulo'),
                tituloNegrito: document.getElementById('negrito-titulo'),
                tituloItalico: document.getElementById('italico-titulo'),
                
                autorTamanho: document.getElementById('tamanho-autor'),
                autorNegrito: document.getElementById('negrito-autor'),
                autorItalico: document.getElementById('italico-autor'),
                
                letraTamanho: document.getElementById('tamanho-letra'),
                letraNegrito: document.getElementById('negrito-letra'),
                letraItalico: document.getElementById('italico-letra')
            };

            const preview = {
                titulo: document.getElementById('preview-titulo'),
                autor: document.getElementById('preview-autor'),
                letra: document.getElementById('preview-letra'),
                documento: document.getElementById('documento-pdf')
            };

            const btnBaixar = document.getElementById('btn-baixar');

            function atualizarVisao() {
                preview.titulo.textContent = formInputs.titulo.value.trim() || 'TÍTULO DO HINO';
                preview.autor.textContent = formInputs.autor.value.trim() || 'Nome do Cantor / Autor';

                const textoLetra = formInputs.letra.value.trim();
                if (textoLetra) {
                    const estrofes = textoLetra.split(/\n\s*\n/);
                    const htmlFormatado = estrofes.map(estrofe => {
                        const linhas = estrofe.replace(/\n/g, '<br>');
                        return `<div class="estrofe">${linhas}</div>`;
                    }).join('');
                    preview.letra.innerHTML = htmlFormatado;
                } else {
                    preview.letra.innerHTML = `<div class="text-slate-400 italic text-center opacity-70" style="column-span: all; margin-top: 50px;"><p>A letra formatada aparecerá aqui.</p></div>`;
                }

                preview.documento.style.fontFamily = styleInputs.fonteGlobal.value;
                
                if (styleInputs.orientacao.value === 'landscape') {
                    preview.documento.classList.remove('retrato');
                    preview.documento.classList.add('paisagem');
                } else {
                    preview.documento.classList.remove('paisagem');
                    preview.documento.classList.add('retrato');
                }
                
                preview.titulo.style.fontSize = `${styleInputs.tituloTamanho.value}px`;
                preview.titulo.style.fontWeight = styleInputs.tituloNegrito.checked ? 'bold' : 'normal';
                preview.titulo.style.fontStyle = styleInputs.tituloItalico.checked ? 'italic' : 'normal';

                preview.autor.style.fontSize = `${styleInputs.autorTamanho.value}px`;
                preview.autor.style.fontWeight = styleInputs.autorNegrito.checked ? 'bold' : 'normal';
                preview.autor.style.fontStyle = styleInputs.autorItalico.checked ? 'italic' : 'normal';

                preview.letra.style.fontSize = `${styleInputs.letraTamanho.value}px`;
                preview.letra.style.fontWeight = styleInputs.letraNegrito.checked ? 'bold' : 'normal';
                preview.letra.style.fontStyle = styleInputs.letraItalico.checked ? 'italic' : 'normal';
            }

            const todosOsInputs = [...Object.values(formInputs), ...Object.values(styleInputs)];
            todosOsInputs.forEach(input => {
                input.addEventListener('input', atualizarVisao); 
                input.addEventListener('change', atualizarVisao); 
            });

            btnBaixar.addEventListener('click', () => {
                const elemento = preview.documento;
                const nomeBase = formInputs.titulo.value.trim() || 'hino';
                const nomeArquivo = nomeBase.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '_').toLowerCase();

                const conteudoOriginalBtn = btnBaixar.innerHTML;
                btnBaixar.innerHTML = `Gerando...`;
                btnBaixar.disabled = true;
                btnBaixar.classList.add('opacity-75', 'cursor-not-allowed');

                const opcoesPDF = {
                    margin:       [5, 5, 5, 5], 
                    filename:     `${nomeArquivo}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        letterRendering: true,
                        windowWidth: 1024 // Força a renderização com proporção de tela Desktop para evitar quebras em uso via mobile
                    }, 
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: styleInputs.orientacao.value }
                };

                html2pdf().set(opcoesPDF).from(elemento).save().then(() => {
                    btnBaixar.innerHTML = conteudoOriginalBtn;
                    btnBaixar.disabled = false;
                    btnBaixar.classList.remove('opacity-75', 'cursor-not-allowed');
                }).catch(erro => {
                    console.error('Falha na geração:', erro);
                    alert('Erro ao gerar documento. Verifique o console.');
                    btnBaixar.innerHTML = conteudoOriginalBtn;
                    btnBaixar.disabled = false;
                    btnBaixar.classList.remove('opacity-75', 'cursor-not-allowed');
                });
            });
            
            atualizarVisao();
        });
    </script>
</body>
</html>
